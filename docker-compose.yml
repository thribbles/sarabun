services:
  postgres:
    image: postgres:16-alpine
    container_name: sarabun_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sarabun
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sarabun"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./sarabun-system
      dockerfile: apps/api/Dockerfile
    container_name: sarabun_api
    restart: always
    environment:
      PORT: 3001
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/sarabun?schema=public"
      WEB_ORIGIN: "http://localhost:3000"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./sarabun-system
      dockerfile: apps/web/Dockerfile
    container_name: sarabun_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
