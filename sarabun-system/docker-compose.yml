version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sarabun
      POSTGRES_PASSWORD: sarabun
      POSTGRES_DB: sarabun
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: ./apps/api/.env
    depends_on: [postgres, redis]
    ports: ["3001:3001"]

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
